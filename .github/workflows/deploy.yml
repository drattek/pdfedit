name: Deploy pdfedit a Azure Container Apps

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'deploy_n8n_aca.py'
      - 'Dockerfile.n8n'
      - 'n8n_outlook/**'
  workflow_dispatch:

permissions:
  id-token: write   # login OIDC a Azure
  contents: read

env:
  RESOURCE_GROUP: autos
  APP_NAME: pdfedit
  ACR_NAME: pdfeditacr
  IMAGE_REPO: pdfedit
  CPU: '1.0'
  MEMORY: 2.0Gi

concurrency:
  group: deploy-pdfedit
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login a Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build y push de la imagen en ACR
        run: |
          TAG="${GITHUB_SHA::8}"
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
          az acr build -r "$ACR_NAME" \
            -t "$IMAGE_REPO:$TAG" \
            -t "$IMAGE_REPO:latest" \
            -f Dockerfile .

      - name: Actualizar Container App
        run: |
          LOGIN_SERVER=$(az acr show -n "$ACR_NAME" --query loginServer -o tsv)
          az containerapp update \
            -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --image "$LOGIN_SERVER/$IMAGE_REPO:$IMAGE_TAG" \
            --revision-suffix "sha-$IMAGE_TAG" \
            --cpu "$CPU" --memory "$MEMORY"

      - name: Esperar a que la revisión nueva arranque
        run: |
          REV="$APP_NAME--sha-$IMAGE_TAG"
          echo "Esperando a que $REV quede Healthy/Running (máx 10 min)..."
          for i in $(seq 1 60); do
            read -r HEALTH RUNNING <<< "$(az containerapp revision list \
              -n "$APP_NAME" -g "$RESOURCE_GROUP" \
              --query "[?name=='$REV'].[properties.healthState, properties.runningState] | [0]" \
              -o tsv | tr '\t' ' ')"
            echo "  intento $i: health=$HEALTH running=$RUNNING"
            if [ "$RUNNING" = "Running" ] && [ "$HEALTH" = "Healthy" ]; then
              echo "Revisión $REV arriba y saludable."
              exit 0
            fi
            if [ "$RUNNING" = "Failed" ] || [ "$RUNNING" = "Stopped" ]; then
              break
            fi
            sleep 10
          done
          echo "::error::La revisión $REV no arrancó (health=$HEALTH running=$RUNNING). Logs del contenedor:"
          az containerapp logs show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision "$REV" --type console --tail 60 || true
          echo "El tráfico sigue en la última revisión sana."
          exit 1

      - name: Verificar
        run: |
          FQDN=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Desplegado en https://$FQDN"
          az containerapp revision list -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query "[?properties.active].{rev:name,traffic:properties.trafficWeight,health:properties.healthState}" -o table
